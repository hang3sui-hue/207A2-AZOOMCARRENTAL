<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport: makes the page scale correctly on mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Cars | AZoom Car Rental</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <a href="index.html" class="logo"></a>
<nav>
<ul>
  <li><a href="index.html" class="Home">Home</a></li>
  <li><a href="cars.html" class="Cars active">Cars</a></li>
  <li><a href="reserve.html" class="Reserve">Reserve</a></li>
  <li><a href="bookings.html" class="MyBookings">My Bookings</a></li>
  <li><a href="login.html" class="Login">Login</a></li>
</ul>
</nav>
</header>

  <main>
<section class="page-hero">
  <h1 class="page-title">Our Fleet</h1>
  <p class="page-intro">Premium electric cars for every journey. Rent by the day, week or month.</p>
</section>

<section class="filters">
  <div class="filter-item">
    <label for="type-filter" class="filter-label">Car type</label>
    <select id="type-filter" class="filter-select">
      <option value="all">All types</option>
    </select>
  </div>
  <div class="filter-item">
    <label for="branch-filter" class="filter-label">Branch</label>
    <select id="branch-filter" class="filter-select">
      <option value="all">All branches</option>
    </select>
  </div>
  <div class="filter-item">
    <label for="sort-select" class="filter-label">Sort by price</label>
    <select id="sort-select" class="filter-select">
      <option value="none">Recommended</option>
      <option value="low">Low to high</option>
      <option value="high">High to low</option>
    </select>
  </div>
  <p id="result-count" class="result-count"></p>
</section>

<section class="car-section">
  <!-- the car cards are added here by js/cars.js -->
  <div id="car-list" class="car-list"></div>
</section>
  </main>

  <footer class="footer">
    <p class="footer-copyright">&copy; 2026 AZoom Car Rental. Luxury for less. All rights reserved.</p>
    <p class="footer-email">Email: <a href="mailto:hello@azoom.com" class="email-link">hello@azoom.com</a></p>
    <p class="footer-staff"><a href="staff.html" class="staff-link">Staff Portal</a></p>
    <p class="JHyper">JHyper</p>
  </footer>

  <!-- load JS at the end of body so the page loads first -->
  <!-- data.js must come first, because cars.js uses the "cars" array -->
  <script src="js/data.js"></script>
  <script src="js/cars.js"></script>
</body>
</html>
